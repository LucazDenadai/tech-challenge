# SonarQube project configuration
sonar.projectKey=tech-challenge
sonar.projectName=Tech Challenge - Oficina Mecânica
sonar.projectVersion=1.0

# Source code (codigo de producao)
sonar.sources=src/
sonar.exclusions=**/bin/**,**/obj/**,**/Migrations/**,**/node_modules/**

# Language
sonar.language=cs

# Encoding
sonar.sourceEncoding=UTF-8

# Test files
sonar.tests=tests/
sonar.test.inclusions=**/*Tests.cs,**/*Test.cs

# Cobertura de codigo (OpenCover gerado pelo coverlet via coverlet.runsettings)
# Para gerar: dotnet test --settings coverlet.runsettings
# Os arquivos sao criados em TestResults/**/coverage.opencover.xml
sonar.cs.opencover.reportsPaths=**/coverage.opencover.xml

# Exclusions for coverage (nao medir cobertura em: entry point, testes, migrations)
sonar.coverage.exclusions=**/Program.cs,**/*Tests.cs,**/*Test.cs,**/Migrations/**

# Suppress S2068 (hardcoded password) para arquivos de configuracao (falso positivo)
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=*:S2068
sonar.issue.ignore.multicriteria.e1.resourceKey=**/appsettings*.json
