# SonarQube project configuration
sonar.projectKey=tech-challenge
sonar.projectName=Tech Challenge - Oficina Mecânica
sonar.projectVersion=1.0

# Source code (codigo de producao)
sonar.sources=src/
sonar.exclusions=**/bin/**,**/obj/**,**/Migrations/**,**/node_modules/**,**/tests/**,**/TestResults/**

# Language
sonar.language=cs

# Encoding
sonar.sourceEncoding=UTF-8

# Test files (excluidos da analise principal, mas podem ser analisados separadamente se quiser)
# sonar.tests=tests/
# sonar.test.inclusions=**/*Tests.cs,**/*Test.cs

# Cobertura de codigo (OpenCover gerado pelo coverlet via coverlet.runsettings)
# Para gerar: dotnet test --settings coverlet.runsettings
# Os arquivos sao criados em TestResults/**/coverage.opencover.xml
sonar.cs.opencover.reportsPaths=**/coverage.opencover.xml

# Exclusions for coverage (nao medir cobertura em: entry point, testes, migrations, DTOs)
# DTOs sao excluidos pois sao containers de dados sem logica; os atributos de validacao
# ([Required], [MaxLength], etc.) sao metadata e nao sao executaveis.
sonar.coverage.exclusions=**/Program.cs,**/*Tests.cs,**/*Test.cs,**/Migrations/**,**/DTOs/**/*.cs,**/*.g.cs

# S2068 (hardcoded password) - falso positivo em arquivos de configuracao de dev
# S1192 (string literal repetida) - codigo gerado automaticamente pelo EF Core (migrations)
sonar.issue.ignore.multicriteria=e1,e2,e3
sonar.issue.ignore.multicriteria.e1.ruleKey=*:S2068
sonar.issue.ignore.multicriteria.e1.resourceKey=**/appsettings*.json
sonar.issue.ignore.multicriteria.e2.ruleKey=*:S2068
sonar.issue.ignore.multicriteria.e2.resourceKey=**/launchSettings.json
sonar.issue.ignore.multicriteria.e3.ruleKey=*:S1192
sonar.issue.ignore.multicriteria.e3.resourceKey=**/Migrations/**
