name: CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  id-token: write
  contents: read
  packages: write

env:
  DOTNET_VERSION: '10.0.x'
  REGISTRY: ghcr.io
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: oficina-mecanica

jobs:
  build-and-test:
    name: Build, Test & Analyze
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@3951f0dfe7a07e2313ec93c75700083e2005cbab # v4.3.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install SonarCloud scanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Restore dependencies
        run: dotnet restore

      - name: Begin SonarCloud analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
        run: |
          dotnet sonarscanner begin \
            /k:"tech-challenge" \
            /o:"$SONAR_ORGANIZATION" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml" \
            /d:sonar.exclusions="**/Migrations/**,**/bin/**,**/obj/**" \
            /d:sonar.coverage.exclusions="**/Program.cs,**/*Tests.cs,**/Migrations/**,**/DTOs/**/*.cs,**/*.g.cs"

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run Unit Tests with coverage
        run: |
          dotnet test tests/Atendimento/OficinaMecanica.Atendimento.UnitTests \
            --no-build --configuration Release \
            --settings coverlet.runsettings \
            --results-directory ./coverage/atendimento-unit
          dotnet test tests/Estoque/OficinaMecanica.Estoque.UnitTests \
            --no-build --configuration Release \
            --settings coverlet.runsettings \
            --results-directory ./coverage/estoque-unit

      - name: Run Integration Tests
        run: |
          dotnet test tests/Atendimento/OficinaMecanica.Atendimento.IntegrationTests \
            --no-build --configuration Release \
            --settings coverlet.runsettings \
            --results-directory ./coverage/atendimento-integration
          dotnet test tests/Estoque/OficinaMecanica.Estoque.IntegrationTests \
            --no-build --configuration Release \
            --settings coverlet.runsettings \
            --results-directory ./coverage/estoque-integration

      - name: End SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Normalize repository name to lowercase
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Build and push Atendimento
        uses: docker/build-push-action@14487ce63c7a62a4a324b0bfb37086795e31c6c1 # v6.16.0
        with:
          context: .
          file: src/Atendimento/OficinaMecanica.Atendimento.API/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.repo.outputs.name }}/oficina-atendimento:${{ github.sha }},ghcr.io/${{ steps.repo.outputs.name }}/oficina-atendimento:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Estoque
        uses: docker/build-push-action@14487ce63c7a62a4a324b0bfb37086795e31c6c1 # v6.16.0
        with:
          context: .
          file: src/Estoque/OficinaMecanica.Estoque.API/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.repo.outputs.name }}/oficina-estoque:${{ github.sha }},ghcr.io/${{ steps.repo.outputs.name }}/oficina-estoque:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d28d111c5fe6722 # v4.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER_NAME }}

      - name: Criar secrets no K8s
        env:
          JWT_KEY: ${{ secrets.JWT_KEY }}
          ATENDIMENTO_CONN: ${{ secrets.ATENDIMENTO_CONNECTION_STRING }}
          ESTOQUE_CONN: ${{ secrets.ESTOQUE_CONNECTION_STRING }}
        run: |
          kubectl create secret generic atendimento-secrets \
            --from-literal=Jwt__Key="$JWT_KEY" \
            --from-literal=ConnectionStrings__DefaultConnection="$ATENDIMENTO_CONN" \
            --namespace=oficina-mecanica \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret generic estoque-secrets \
            --from-literal=ConnectionStrings__DefaultConnection="$ESTOQUE_CONN" \
            --namespace=oficina-mecanica \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Aplicar infraestrutura e configuracoes
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/rabbitmq/ -n oficina-mecanica
          kubectl apply -f k8s/atendimento/configmap.yaml -n oficina-mecanica
          kubectl apply -f k8s/estoque/configmap.yaml -n oficina-mecanica
          kubectl apply -f k8s/observabilidade/ -n observabilidade

      - name: Aplicar deployments e servicos
        run: |
          sed -i "s/GIT_SHA_PLACEHOLDER/${{ github.sha }}/" k8s/atendimento/deployment.yaml
          sed -i "s/GIT_SHA_PLACEHOLDER/${{ github.sha }}/" k8s/estoque/deployment.yaml

          kubectl apply -f k8s/atendimento/service.yaml -n oficina-mecanica
          kubectl apply -f k8s/atendimento/hpa.yaml -n oficina-mecanica
          kubectl apply -f k8s/atendimento/deployment.yaml -n oficina-mecanica

          kubectl apply -f k8s/estoque/service.yaml -n oficina-mecanica
          kubectl apply -f k8s/estoque/hpa.yaml -n oficina-mecanica
          kubectl apply -f k8s/estoque/deployment.yaml -n oficina-mecanica

      - name: Aguardar rollout
        run: |
          kubectl rollout status deployment/atendimento -n oficina-mecanica
          kubectl rollout status deployment/estoque -n oficina-mecanica
