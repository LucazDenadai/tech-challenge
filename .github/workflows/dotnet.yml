name: CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  DOTNET_VERSION: '10.0.x'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test:
    name: Build, Test & Analyze
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install SonarCloud scanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Restore dependencies
        run: dotnet restore

      - name: Begin SonarCloud analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
        run: |
          dotnet sonarscanner begin \
            /k:"tech-challenge" \
            /o:"$SONAR_ORGANIZATION" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml" \
            /d:sonar.exclusions="**/Migrations/**,**/bin/**,**/obj/**" \
            /d:sonar.coverage.exclusions="**/Program.cs,**/*Tests.cs,**/Migrations/**,**/DTOs/**/*.cs,**/*.g.cs"

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run Unit Tests with coverage
        run: |
          dotnet test tests/Atendimento/OficinaMecanica.Atendimento.UnitTests \
            --no-build --configuration Release \
            --settings coverlet.runsettings \
            --collect:"XPlat Code Coverage" \
            --results-directory ./coverage
          dotnet test tests/Estoque/OficinaMecanica.Estoque.UnitTests \
            --no-build --configuration Release \
            --settings coverlet.runsettings \
            --collect:"XPlat Code Coverage" \
            --results-directory ./coverage

      - name: Run Integration Tests
        run: |
          dotnet test tests/Atendimento/OficinaMecanica.Atendimento.IntegrationTests \
            --no-build --configuration Release \
            --collect:"XPlat Code Coverage" \
            --results-directory ./coverage
          dotnet test tests/Estoque/OficinaMecanica.Estoque.IntegrationTests \
            --no-build --configuration Release \
            --collect:"XPlat Code Coverage" \
            --results-directory ./coverage

      - name: End SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Atendimento
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Atendimento/OficinaMecanica.Atendimento.API/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/oficina-atendimento:${{ github.sha }},ghcr.io/${{ github.repository }}/oficina-atendimento:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Estoque
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Estoque/OficinaMecanica.Estoque.API/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/oficina-estoque:${{ github.sha }},ghcr.io/${{ github.repository }}/oficina-estoque:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/k8s-set-context@v4
        with:
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Criar secrets no K8s
        run: |
          kubectl create secret generic atendimento-secrets \
            --from-literal=Jwt__Key=${{ secrets.JWT_KEY }} \
            --from-literal=ConnectionStrings__Default=${{ secrets.ATENDIMENTO_CONNECTION_STRING }} \
            --namespace=oficina-mecanica \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret generic estoque-secrets \
            --from-literal=ConnectionStrings__Default=${{ secrets.ESTOQUE_CONNECTION_STRING }} \
            --namespace=oficina-mecanica \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Aplicar migration Atendimento
        run: |
          kubectl apply -f k8s/atendimento/migration-job.yaml -n oficina-mecanica
          kubectl wait --for=condition=complete job/atendimento-migration \
            --timeout=120s -n oficina-mecanica

      - name: Aplicar migration Estoque
        run: |
          kubectl apply -f k8s/estoque/migration-job.yaml -n oficina-mecanica
          kubectl wait --for=condition=complete job/estoque-migration \
            --timeout=120s -n oficina-mecanica

      - name: Atualizar imagem nos deployments
        run: |
          kubectl set image deployment/atendimento \
            atendimento=ghcr.io/${{ github.repository }}/oficina-atendimento:${{ github.sha }} \
            -n oficina-mecanica
          kubectl set image deployment/estoque \
            estoque=ghcr.io/${{ github.repository }}/oficina-estoque:${{ github.sha }} \
            -n oficina-mecanica

      - name: Aplicar manifestos K8s
        run: |
          kubectl apply -f k8s/ -n oficina-mecanica
          kubectl apply -f k8s/observabilidade/ -n observabilidade

      - name: Aguardar rollout
        run: |
          kubectl rollout status deployment/atendimento -n oficina-mecanica
          kubectl rollout status deployment/estoque -n oficina-mecanica
