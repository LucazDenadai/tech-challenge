apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-kubernetes
  namespace: observabilidade
data:
  kubernetes.json: |
    {
      "title": "Oficina Mecânica — Kubernetes & HPA",
      "uid": "oficina-kubernetes",
      "schemaVersion": 38,
      "refresh": "10s",
      "time": { "from": "now-30m", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "Pods em execução por deployment",
          "type": "stat",
          "gridPos": { "x": 0, "y": 0, "w": 8, "h": 6 },
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "kube_deployment_status_replicas_ready{namespace=\"oficina-mecanica\"}",
              "legendFormat": "{{deployment}}"
            }
          ],
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "colorMode": "background"
          },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "steps": [
                  { "color": "red", "value": 0 },
                  { "color": "yellow", "value": 1 },
                  { "color": "green", "value": 2 }
                ]
              }
            }
          }
        },
        {
          "id": 2,
          "title": "Réplicas desejadas pelo HPA",
          "type": "stat",
          "gridPos": { "x": 8, "y": 0, "w": 8, "h": 6 },
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "kube_horizontalpodautoscaler_status_desired_replicas{namespace=\"oficina-mecanica\"}",
              "legendFormat": "{{horizontalpodautoscaler}}"
            }
          ],
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "colorMode": "background"
          },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "steps": [
                  { "color": "green", "value": 0 },
                  { "color": "yellow", "value": 5 },
                  { "color": "red", "value": 9 }
                ]
              }
            }
          }
        },
        {
          "id": 3,
          "title": "CPU atual vs. limite por pod",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 6, "w": 12, "h": 8 },
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"oficina-mecanica\", container!=\"\"}[1m])) by (pod)",
              "legendFormat": "{{pod}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "cores",
              "custom": { "lineWidth": 2 }
            }
          }
        },
        {
          "id": 4,
          "title": "Memória RSS por pod",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 6, "w": 12, "h": 8 },
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "container_memory_rss{namespace=\"oficina-mecanica\", container!=\"\"}",
              "legendFormat": "{{pod}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": { "lineWidth": 2 }
            }
          }
        },
        {
          "id": 5,
          "title": "Histórico de escalonamento HPA (réplicas ao longo do tempo)",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 14, "w": 24, "h": 8 },
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "kube_horizontalpodautoscaler_status_current_replicas{namespace=\"oficina-mecanica\"}",
              "legendFormat": "atual — {{horizontalpodautoscaler}}"
            },
            {
              "expr": "kube_horizontalpodautoscaler_status_desired_replicas{namespace=\"oficina-mecanica\"}",
              "legendFormat": "desejado — {{horizontalpodautoscaler}}"
            },
            {
              "expr": "kube_horizontalpodautoscaler_spec_max_replicas{namespace=\"oficina-mecanica\"}",
              "legendFormat": "máximo — {{horizontalpodautoscaler}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": { "lineWidth": 2 }
            }
          }
        }
      ]
    }
