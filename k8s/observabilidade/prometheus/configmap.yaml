apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: observabilidade
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: atendimento
        static_configs:
          - targets: ['atendimento-svc.oficina-mecanica:80']
        metrics_path: /metrics

      - job_name: estoque
        static_configs:
          - targets: ['estoque-svc.oficina-mecanica:80']
        metrics_path: /metrics

      - job_name: jaeger
        static_configs:
          - targets: ['jaeger-svc.observabilidade:14269']
        metrics_path: /metrics
