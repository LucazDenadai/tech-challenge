apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: observabilidade
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: atendimento
        static_configs:
          - targets: ['atendimento-svc.oficina-mecanica:80']
        metrics_path: /metrics

      - job_name: estoque
        static_configs:
          - targets: ['estoque-svc.oficina-mecanica:80']
        metrics_path: /metrics

      - job_name: jaeger
        static_configs:
          - targets: ['jaeger-svc.observabilidade:14269']
        metrics_path: /metrics

      - job_name: kube-state-metrics
        static_configs:
          - targets: ['kube-state-metrics-svc.observabilidade:8080']
        metrics_path: /metrics

      - job_name: cadvisor
        scheme: https
        tls_config:
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
