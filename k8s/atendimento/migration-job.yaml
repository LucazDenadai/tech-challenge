apiVersion: batch/v1
kind: Job
metadata:
  name: atendimento-migration
  namespace: oficina-mecanica
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      containers:
        - name: migration
          image: ghcr.io/lucazdenadai/tech-challenge/oficina-atendimento:1.0.0
          imagePullPolicy: IfNotPresent
          command: ["dotnet", "ef", "database", "update", "--no-build"]
          envFrom:
            - configMapRef:
                name: atendimento-config
            - secretRef:
                name: atendimento-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
              ephemeral-storage: "256Mi"
            limits:
              memory: "256Mi"
              ephemeral-storage: "512Mi"
  backoffLimit: 2
